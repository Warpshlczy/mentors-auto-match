name: 打包

# 推上 main 就自动出三个平台的包，也可以在 Actions 页面手动点一次。
# 本地跑 scripts/build.py 只能打当前平台，到这里来补齐另外两个。
#
# 打 tag 推送（git tag v0.1.0 && git push rem v0.1.0）时会额外把三个包发到 Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 注意：macos-13 这个 Intel 镜像 2025 年 12 月就退役了，现在的 Intel 标签是 macos-15-intel
          - os: macos-15-intel
            name: macOS Intel
          - os: macos-14        # Apple Silicon（M 系列）
            name: macOS Apple Silicon
          - os: windows-latest
            name: Windows x64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 自检
        run: python tests/test_pdf_checker.py

      - name: 打包
        run: python scripts/build.py

      - uses: actions/upload-artifact@v5
        with:
          # runner.arch 由 GitHub 给出（X64 / ARM64），产物名不会因为标签配错而说谎
          name: MentorMatch-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: 发到 Release
    needs: build
    # 只有推 tag 才发 Release；推 main 只是留个 Actions Artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          # 三个平台的产物摊平到一个目录里
          path: artifacts
          merge-multiple: true

      # 用 runner 自带的 gh，不引第三方 action，省得跟着它们的 Node 版本升级
      - name: 建 Release 并上传三个包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没下载到任何产物，构建是不是失败了？"; exit 1
          fi
          ls -lh "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
